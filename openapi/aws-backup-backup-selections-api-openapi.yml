openapi: 3.1.0
info:
  title: AWS Backup Backup Jobs Backup Selections API
  version: '2018-11-15'
  description: 'AWS Backup is a fully managed, policy-based data protection service that

    centralizes and automates backup of data across AWS services. The AWS

    Backup API exposes REST operations for managing backup plans, backup

    selections, backup vaults, recovery points, restore jobs, and audit

    frameworks. All requests are signed with AWS Signature Version 4 (SigV4).


    See https://docs.aws.amazon.com/aws-backup/latest/devguide/api-reference.html

    for the full reference.

    '
  contact:
    name: AWS Backup Documentation
    url: https://docs.aws.amazon.com/aws-backup/
servers:
- url: https://backup.{region}.amazonaws.com
  description: AWS Backup regional endpoint
  variables:
    region:
      default: us-east-1
      description: AWS region
security:
- SigV4: []
tags:
- name: Backup Selections
paths:
  /backup/plans/{backupPlanId}/selections:
    get:
      tags:
      - Backup Selections
      summary: List backup selections
      operationId: ListBackupSelections
      parameters:
      - $ref: '#/components/parameters/BackupPlanId'
      responses:
        '200':
          $ref: '#/components/responses/OK'
    put:
      tags:
      - Backup Selections
      summary: Create a backup selection
      operationId: CreateBackupSelection
      parameters:
      - $ref: '#/components/parameters/BackupPlanId'
      requestBody:
        $ref: '#/components/requestBodies/JsonBody'
      responses:
        '200':
          $ref: '#/components/responses/OK'
components:
  requestBodies:
    JsonBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    OK:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  parameters:
    BackupPlanId:
      name: backupPlanId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    SigV4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS Signature Version 4 signed Authorization header
